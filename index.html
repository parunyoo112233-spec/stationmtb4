<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเบิก-จ่ายน้ำมันและคลังสินค้า</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <nav class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-gas-pump"></i> ระบบบริหารจัดการน้ำมันเชื้อเพลิง
            </h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded-full"><i class="fas fa-sync-alt animate-spin mr-1"></i> Real-time Connected</span>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        
        <h2 class="text-lg font-semibold mb-4 text-gray-700 flex items-center gap-2">
            <i class="fas fa-chart-pie text-blue-600"></i> แดชบอร์ดคงเหลือในคลังปัจจุบัน
        </h2>
        <div id="dashboard-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-xs border border-gray-100 animate-pulse text-center">กำลังโหลดข้อมูล...</div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-gray-700 border-b pb-2 flex items-center gap-2">
                    <i class="fas fa-edit text-blue-600"></i> บันทึกการ เบิก/รับ น้ำมัน
                </h2>
                <form id="transaction-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">ประเภทธุรกรรม</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center justify-center gap-2 border p-2.5 rounded-lg cursor-pointer bg-red-50 border-red-200 text-red-700 font-medium">
                                <input type="radio" name="transaction_type" value="OUT" checked class="accent-red-600"> เบิกจ่ายน้ำมัน
                            </label>
                            <label class="flex items-center justify-center gap-2 border p-2.5 rounded-lg cursor-pointer bg-green-50 border-green-200 text-green-700 font-medium">
                                <input type="radio" name="transaction_type" value="IN" class="accent-green-600"> รับน้ำมันเข้าคลัง
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">ประเภทน้ำมัน</label>
                        <select id="fuel_type" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">ปริมาณ (ลิตร)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" required placeholder="0.00" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">ชื่อผู้ทำรายการ / ผู้เบิก</label>
                        <input type="text" id="requester_name" required placeholder="ระบุชื่อ-นามสกุล" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">วัตถุประสงค์ / หมายเหตุ</label>
                        <textarea id="purpose" rows="2" placeholder="ระบุเหตุผลการเบิก เช่น ทะเบียนรถ หรือ แผนก" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg shadow-md transition duration-200">
                        <i class="fas fa-save mr-1"></i> บันทึกรายการ
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md border border-gray-100">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2">
                        <i class="fas fa-history text-blue-600"></i> ประวัติการทำธุรกรรมล่าสุด
                    </h2>
                    <button onclick="fetchData()" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                        <i class="fas fa-sync"></i> รีเฟรชข้อมูล
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 text-sm uppercase">
                                <th class="p-3 rounded-l-lg">วัน-เวลา</th>
                                <th class="p-3">ประเภท</th>
                                <th class="p-3">ชนิดน้ำมัน</th>
                                <th class="p-3 text-right">จำนวน (ลิตร)</th>
                                <th class="p-3">ผู้ทำรายการ</th>
                                <th class="p-3 rounded-r-lg">วัตถุประสงค์</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-rows" class="text-sm divide-y divide-gray-100">
                            <tr>
                                <td colspan="6" class="p-4 text-center text-gray-400">ยังไม่มีข้อมูลธุรกรรมในระบบ</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ⚠️ สำคัญ: ใส่ URL และ Anon Key ของโปรเจกต์ Supabase ของคุณตรงนี้
        const SUPABASE_URL = "https://epiagllllnqhgpgwarek.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwaWFnbGxsbG5xaGdwZ3dhcmVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MzMzMjEsImV4cCI6MjA5OTAwOTMyMX0.HLbFl-lt3LPWJ-We3UzpK5XkF5CXO4L0Ur9DBUkqIXc";

        // สร้าง Instance เชื่อมต่อ Supabase
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ฟังก์ชันหลักที่ทำงานเมื่อเปิดหน้าเว็บครั้งแรก
        document.addEventListener("DOMContentLoaded", () => {
            fetchData();
            setupRealtime();
            
            // ผูกฟังก์ชันเข้ากับปุ่มบันทึกฟอร์ม
            document.getElementById("transaction-form").addEventListener("submit", handleTransactionSubmit);
        });

        // ดึงข้อมูลคลังสินค้าและประวัติธุรกรรมทั้งหมด
        async function fetchData() {
            try {
                // 1. ดึงคลังน้ำมัน
                let { data: inventory, error: invError } = await supabase
                    .from('fuel_inventory')
                    .select('*')
                    .order('fuel_type', { ascending: true });
                
                if (invError) throw invError;
                renderDashboard(inventory);
                renderFuelDropdown(inventory);

                // 2. ดึงประวัติธุรกรรม
                let { data: transactions, error: txError } = await supabase
                    .from('fuel_transactions')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);
                
                if (txError) throw txError;
                renderTransactions(transactions);

            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการโหลดข้อมูล: ", error.message);
                alert("ผิดพลาด: " + error.message);
            }
        }

        // แสดงผลแดชบอร์ด (Real-time Stock)
        function renderDashboard(inventory) {
            const container = document.getElementById("dashboard-container");
            container.innerHTML = "";

            if (!inventory || inventory.length === 0) {
                container.innerHTML = `<div class="col-span-3 text-center text-gray-500 py-4">ไม่มีข้อมูลน้ำมันในระบบคลัง</div>`;
                return;
            }

            inventory.forEach(item => {
                // ปรับแต่งสีแสดงผลตามประเภทน้ำมันเบื้องต้น
                let iconColor = "text-yellow-500";
                if(item.fuel_type.includes("ดีเซล")) iconColor = "text-blue-500";
                if(item.fuel_type.includes("E20")) iconColor = "text-green-500";

                const card = document.createElement("div");
                card.className = "bg-white p-6 rounded-xl shadow-md border border-gray-100 flex items-center justify-between transition hover:shadow-lg";
                card.innerHTML = `
                    <div>
                        <p class="text-sm font-semibold text-gray-400 uppercase tracking-wider">${item.fuel_type}</p>
                        <h3 class="text-3xl font-extrabold text-gray-800 mt-1">${Number(item.current_balance).toLocaleString('th-TH', {minimumFractionDigits: 2})}</h3>
                        <p class="text-xs text-gray-400 mt-1">อัปเดต: ${new Date(item.updated_at).toLocaleString('th-TH')}</p>
                    </div>
                    <div class="text-4xl ${iconColor} bg-gray-50 p-4 rounded-full">
                        <i class="fas fa-gas-pump"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // โหลดตัวเลือกน้ำมันใส่ Dropdown Select ในฟอร์ม
        function renderFuelDropdown(inventory) {
            const select = document.getElementById("fuel_type");
            const currentValue = select.value; // บันทึกค่าที่เลือกไว้ก่อนหน้าถ้ามี
            select.innerHTML = "";
            
            inventory.forEach(item => {
                const option = document.createElement("option");
                option.value = item.fuel_type;
                option.textContent = `${item.fuel_type} (คงเหลือ: ${item.current_balance} ลิตร)`;
                select.appendChild(option);
            });

            if (currentValue) select.value = currentValue;
        }

        // แสดงผลตารางประวัติธุรกรรม
        function renderTransactions(transactions) {
            const tbody = document.getElementById("transaction-rows");
            tbody.innerHTML = "";

            if (!transactions || transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">ยังไม่มีข้อมูลธุรกรรมในระบบ</td></tr>`;
                return;
            }

            transactions.forEach(tx => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-gray-50 transition";
                
                const badgeClass = tx.transaction_type === 'IN' 
                    ? 'bg-green-100 text-green-800' 
                    : 'bg-red-100 text-red-800';
                
                const typeText = tx.transaction_type === 'IN' ? 'รับเข้าคลัง' : 'เบิกจ่าย';

                tr.innerHTML = `
                    <td class="p-3 text-gray-500 text-xs">${new Date(tx.created_at).toLocaleString('th-TH')}</td>
                    <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">${typeText}</span></td>
                    <td class="p-3 font-medium text-gray-700">${tx.fuel_type}</td>
                    <td class="p-3 text-right font-bold ${tx.transaction_type === 'IN' ? 'text-green-600' : 'text-red-600'}">${tx.transaction_type === 'IN' ? '+' : '-'}${Number(tx.amount).toFixed(2)}</td>
                    <td class="p-3 text-gray-600">${tx.requester_name}</td>
                    <td class="p-3 text-gray-400 text-xs truncate max-w-xs" title="${tx.purpose || ''}">${tx.purpose || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ฟังก์ชันเมื่อกดปุ่มบันทึกส่งข้อมูลขึ้น Supabase
        async function handleTransactionSubmit(e) {
            e.preventDefault();

            const transaction_type = document.querySelector('input[name="transaction_type"]:checked').value;
            const fuel_type = document.getElementById("fuel_type").value;
            const amount = parseFloat(document.getElementById("amount").value);
            const requester_name = document.getElementById("requester_name").value;
            const purpose = document.getElementById("purpose").value;

            if(!fuel_type) {
                alert("กรุณาเลือกประเภทน้ำมัน");
                return;
            }

            try {
                // ส่งข้อมูลเข้าไปที่ตารางธุรกรรม (ระบบฝั่ง Database จะสั่ง Trigger เพื่อตัด/เพิ่ม ยอดน้ำมันให้อัตโนมัติ)
                const { data, error } = await supabase
                    .from('fuel_transactions')
                    .insert([
                        { transaction_type, fuel_type, amount, requester_name, purpose }
                    ]);

                if (error) throw error;

                // รีเซ็ตค่าในฟอร์ม ยกเว้นชื่อผู้ทำรายการและประเภทน้ำมันเพื่อความสะดวกรวดเร็วในการกรอกครั้งต่อไป
                document.getElementById("amount").value = "";
                document.getElementById("purpose").value = "";
                
                // แจ้งเตือนสั้นๆ และโหลดข้อมูลใหม่ทันที
                alert("บันทึกธุรกรรมเรียบร้อยแล้วและคลังปรับปรุงสำเร็จ!");
                fetchData();

            } catch (error) {
                console.error("เกิดข้อผิดพลาด: ", error.message);
                // ดึงข้อผิดพลาดจาก Trigger เช่น ถ้าน้ำมันไม่พอบันทึกเบิก
                alert("ไม่สามารถทำรายการได้: " + error.message);
            }
        }

        // ระบบ Real-time Listening (ดักฟังการเปลี่ยนแปลงที่เกิดขึ้นในฐานข้อมูลแล้วรีเฟรชหน้าจออัตโนมัติ)
        function setupRealtime() {
            // ดักฟังการอัปเดตของตารางคลังสินค้า และรายการเดินบัญชี
            supabase
                .channel('fuel_changes_channel')
                .on('postgres_changes', { event: '*', filter: '*:*', schema: 'public' }, (payload) => {
                    console.log('พบการเปลี่ยนแปลงแบบเรียลไทม์:', payload);
                    fetchData(); // ดึงข้อมูลและอัปเดต Dashboard / ตารางธุรกรรมทันที
                })
                .subscribe();
        }
    </script>
</body>
</html>
