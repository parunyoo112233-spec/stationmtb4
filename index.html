<script>
        // ⚠️ ใส่ URL และ Anon Key ของโปรเจกต์ Supabase ของคุณตรงนี้
        const SUPABASE_URL = "https://epiagllllnqhgpgwarek.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwaWFnbGxsbG5xaGdwZ3dhcmVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MzMzMjEsImV4cCI6MjA5OTAwOTMyMX0.HLbFl-lt3LPWJ-We3UzpK5XkF5CXO4L0Ur9DBUkqIXc";

        // เปลี่ยนชื่อเป็น supabaseClient เพื่อไม่ให้ชนกับค่าเริ่มต้นของระบบ
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ฟังก์ชันหลักที่ทำงานเมื่อเปิดหน้าเว็บครั้งแรก
        document.addEventListener("DOMContentLoaded", () => {
            fetchData();
            setupRealtime();
            
            // ผูกฟังก์ชันเข้ากับปุ่มบันทึกฟอร์ม
            document.getElementById("transaction-form").addEventListener("submit", handleTransactionSubmit);
        });

        // ดึงข้อมูลคลังสินค้าและประวัติธุรกรรมทั้งหมด
        async function fetchData() {
            try {
                // 1. ดึงคลังน้ำมัน
                let { data: inventory, error: invError } = await supabaseClient
                    .from('fuel_inventory')
                    .select('*')
                    .order('fuel_type', { ascending: true });
                
                if (invError) throw invError;
                renderDashboard(inventory);
                renderFuelDropdown(inventory);

                // 2. ดึงประวัติธุรกรรม
                let { data: transactions, error: txError } = await supabaseClient
                    .from('fuel_transactions')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);
                
                if (txError) throw txError;
                renderTransactions(transactions);

            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการโหลดข้อมูล: ", error.message);
                alert("ผิดพลาด: " + error.message);
            }
        }

        // แสดงผลแดชบอร์ด (Real-time Stock)
        function renderDashboard(inventory) {
            const container = document.getElementById("dashboard-container");
            container.innerHTML = "";

            if (!inventory || inventory.length === 0) {
                container.innerHTML = `<div class="col-span-3 text-center text-gray-500 py-4">ไม่มีข้อมูลน้ำมันในระบบคลัง</div>`;
                return;
            }

            inventory.forEach(item => {
                let iconColor = "text-yellow-500";
                if(item.fuel_type.includes("ดีเซล")) iconColor = "text-blue-500";
                if(item.fuel_type.includes("E20")) iconColor = "text-green-500";

                const card = document.createElement("div");
                card.className = "bg-white p-6 rounded-xl shadow-md border border-gray-100 flex items-center justify-between transition hover:shadow-lg";
                card.innerHTML = `
                    <div>
                        <p class="text-sm font-semibold text-gray-400 uppercase tracking-wider">${item.fuel_type}</p>
                        <h3 class="text-3xl font-extrabold text-gray-800 mt-1">${Number(item.current_balance).toLocaleString('th-TH', {minimumFractionDigits: 2})}</h3>
                        <p class="text-xs text-gray-400 mt-1">อัปเดต: ${new Date(item.updated_at).toLocaleString('th-TH')}</p>
                    </div>
                    <div class="text-4xl ${iconColor} bg-gray-50 p-4 rounded-full">
                        <i class="fas fa-gas-pump"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // โหลดตัวเลือกน้ำมันใส่ Dropdown Select ในฟอร์ม
        function renderFuelDropdown(inventory) {
            const select = document.getElementById("fuel_type");
            const currentValue = select.value;
            select.innerHTML = "";
            
            inventory.forEach(item => {
                const option = document.createElement("option");
                option.value = item.fuel_type;
                option.textContent = `${item.fuel_type} (คงเหลือ: ${item.current_balance} ลิตร)`;
                select.appendChild(option);
            });

            if (currentValue) select.value = currentValue;
        }

        // แสดงผลตารางประวัติธุรกรรม
        function renderTransactions(transactions) {
            const tbody = document.getElementById("transaction-rows");
            tbody.innerHTML = "";

            if (!transactions || transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">ยังไม่มีข้อมูลธุรกรรมในระบบ</td></tr>`;
                return;
            }

            transactions.forEach(tx => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-gray-50 transition";
                
                const badgeClass = tx.transaction_type === 'IN' 
                    ? 'bg-green-100 text-green-800' 
                    : 'bg-red-100 text-red-800';
                
                const typeText = tx.transaction_type === 'IN' ? 'รับเข้าคลัง' : 'เบิกจ่าย';

                tr.innerHTML = `
                    <td class="p-3 text-gray-500 text-xs">${new Date(tx.created_at).toLocaleString('th-TH')}</td>
                    <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">${typeText}</span></td>
                    <td class="p-3 font-medium text-gray-700">${tx.fuel_type}</td>
                    <td class="p-3 text-right font-bold ${tx.transaction_type === 'IN' ? 'text-green-600' : 'text-red-600'}">${tx.transaction_type === 'IN' ? '+' : '-'}${Number(tx.amount).toFixed(2)}</td>
                    <td class="p-3 text-gray-600">${tx.requester_name}</td>
                    <td class="p-3 text-gray-400 text-xs truncate max-w-xs" title="${tx.purpose || ''}">${tx.purpose || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ฟังก์ชันเมื่อกดปุ่มบันทึกส่งข้อมูลขึ้น Supabase
        async function handleTransactionSubmit(e) {
            e.preventDefault();

            const transaction_type = document.querySelector('input[name="transaction_type"]:checked').value;
            const fuel_type = document.getElementById("fuel_type").value;
            const amount = parseFloat(document.getElementById("amount").value);
            const requester_name = document.getElementById("requester_name").value;
            const purpose = document.getElementById("purpose").value;

            if(!fuel_type) {
                alert("กรุณาเลือกประเภทน้ำมัน");
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('fuel_transactions')
                    .insert([
                        { transaction_type, fuel_type, amount, requester_name, purpose }
                    ]);

                if (error) throw error;

                document.getElementById("amount").value = "";
                document.getElementById("purpose").value = "";
                
                alert("บันทึกธุรกรรมเรียบร้อยแล้วและคลังปรับปรุงสำเร็จ!");
                fetchData();

            } catch (error) {
                console.error("เกิดข้อผิดพลาด: ", error.message);
                alert("ไม่สามารถทำรายการได้: " + error.message);
            }
        }

        // ระบบ Real-time Listening
        function setupRealtime() {
            supabaseClient
                .channel('fuel_changes_channel')
                .on('postgres_changes', { event: '*', filter: '*:*', schema: 'public' }, (payload) => {
                    console.log('พบการเปลี่ยนแปลงแบบเรียลไทม์:', payload);
                    fetchData();
                })
                .subscribe();
        }
    </script>
